<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>藏书阁</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
:root{
  --bg:#f7f4ef;--bg2:#faf9f7;--bg3:#fff;
  --border:#ede8e0;--border2:#e8e2da;--border3:#e0d9d0;
  --text:#1e293b;--text2:#64748b;--text3:#94a3b8;--text4:#b0a99f;
  --accent:#4f46e5;--accent-bg:#eef2ff;
}
body{background:var(--bg);font-family:'Noto Serif SC','Source Han Serif CN',Georgia,serif;color:var(--text);min-height:100vh;padding-bottom:60px;}
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:#f1ede6;}
::-webkit-scrollbar-thumb{background:#d4cac0;border-radius:3px;}

input,textarea,select{width:100%;background:var(--bg3);border:1.5px solid var(--border2);color:var(--text);outline:none;border-radius:8px;padding:9px 13px;font-family:inherit;font-size:14px;transition:border-color .18s,box-shadow .18s;}
input[type=date]{color-scheme:light;padding:9px 13px;height:auto;min-height:unset;appearance:none;-webkit-appearance:none;}
input:focus,textarea:focus,select:focus{border-color:var(--accent)!important;box-shadow:0 0 0 3px rgba(99,102,241,.1);}
input::placeholder,textarea::placeholder{color:var(--text4);}
select option{background:#fff;color:var(--text);}
textarea{resize:vertical;}

.btn{cursor:pointer;border:none;border-radius:8px;font-family:inherit;font-size:14px;transition:all .16s;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{filter:brightness(.93);transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-primary{background:var(--accent);color:#fff;padding:9px 20px;font-weight:600;box-shadow:0 2px 10px rgba(79,70,229,.28);}
.btn-ghost{background:#f1ede8;color:#8c8680;padding:9px 22px;}
.btn-danger{background:#fff1f2;color:#e11d48;padding:6px 14px;font-size:12px;font-weight:700;}
.btn-edit{background:var(--accent-bg);color:var(--accent);padding:6px 14px;font-size:12px;font-weight:700;}
.btn-sm{padding:5px 12px;font-size:12px;}
.tag-btn{cursor:pointer;border:1.5px solid var(--border3);border-radius:20px;font-size:13px;font-family:inherit;padding:5px 14px;transition:all .16s;background:var(--bg3);color:#8c8680;}
.tag-btn:hover{filter:brightness(.93);}
.tag-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 8px rgba(79,70,229,.2);}

/* Header */
#header{background:linear-gradient(135deg,#fffbf5 0%,#ede8e0 100%);border-bottom:1px solid #ddd5c8;padding:34px 32px 26px;position:relative;overflow:hidden;}
#header::before{content:'';position:absolute;top:-50px;right:-50px;width:320px;height:320px;pointer-events:none;background:radial-gradient(circle,rgba(251,191,36,.13) 0%,transparent 68%);}
.inner{max-width:940px;margin:0 auto;}
#header h1{font-family:'Playfair Display','Noto Serif SC',serif;font-size:27px;font-weight:700;color:var(--text);letter-spacing:.04em;display:flex;align-items:center;gap:12px;}
.h1-sub{font-size:10px;color:var(--text4);letter-spacing:.22em;padding-top:6px;font-family:'Noto Serif SC',serif;font-weight:400;}
#header p{margin:4px 0 22px 40px;color:var(--text4);font-size:13px;}

/* Stats */
.stats{display:flex;gap:12px;flex-wrap:wrap;}
.stat-card{background:#fff;border-radius:12px;padding:9px 18px;text-align:center;min-width:68px;cursor:pointer;border:2px solid transparent;transition:all .15s;}
.stat-card:hover{transform:translateY(-1px);}
.stat-num{font-size:20px;font-weight:700;font-family:'Playfair Display',serif;}
.stat-lbl{font-size:11px;opacity:.75;margin-top:1px;}

/* Controls */
#controls{max-width:940px;margin:20px auto 0;padding:0 24px;}
.ctrl-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
.ctrl-row input{flex:1;min-width:180px;}
.ctrl-row select{width:118px;}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px;}

/* Filter panel */
#filter-panel{background:var(--bg3);border:1.5px solid var(--border2);border-radius:14px;padding:18px 20px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,.08);display:none;}
#filter-panel.open{display:block;}
.fp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.fp-head-title{font-weight:700;font-size:14px;color:var(--text);}
.fp-head-actions{display:flex;gap:8px;}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.filter-grid label{font-size:12px;color:#8c8680;display:block;margin-bottom:6px;font-weight:600;}
.range-row{display:flex;align-items:center;gap:6px;}
.range-row input{flex:1;}
.range-sep{color:var(--text4);font-size:12px;flex-shrink:0;}
.rating-btns{display:flex;gap:4px;}
.rating-btn{flex:1;padding:6px 0;font-size:11px;border:none;border-radius:6px;cursor:pointer;background:#f1f5f9;color:#64748b;font-weight:400;transition:all .15s;}
.rating-btn.active{background:var(--accent);color:#fff;font-weight:700;}
.filter-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.ftag{padding:3px 10px;border-radius:20px;font-size:11px;}

/* Book list */
#book-list{display:flex;flex-direction:column;gap:9px;}
.book-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:14px;padding:13px 14px 13px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 6px rgba(0,0,0,.04);cursor:pointer;transition:all .2s cubic-bezier(.4,0,.2,1);}
.book-card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,.09);background:var(--bg3);}
.book-info{flex:1;min-width:0;}

/* Row 1: title (no wrap) + status badge — always on one line */
.book-row1{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden;}
.book-title-text{font-weight:600;font-size:15px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:1;min-width:0;}
.book-status-badge{flex-shrink:0;}

/* Row 2: category + douban — wrap allowed */
.book-row2{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}

/* Row 3: author + year on one line */
.book-meta-line{color:var(--text4);font-size:12px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4;}

/* Row 4: added date on its own line */
.book-date-line{color:var(--text4);font-size:12px;margin-top:1px;line-height:1.4;}

/* Actions: vertical stack */
.book-actions{display:flex;flex-direction:column;gap:5px;flex-shrink:0;}

/* Cover */
.cover{border-radius:5px;flex-shrink:0;overflow:hidden;position:relative;}
.cover img{width:100%;height:100%;object-fit:cover;display:block;}
.cover-spine{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.18);z-index:2;}
.cover-gen{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.cover-gen-title{color:rgba(255,255,255,.9);font-weight:700;text-align:center;padding:0 6px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

/* Badges */
.badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.badge-cat{border:none;}
.db-badge{display:inline-flex;align-items:center;gap:3px;background:#fff7ed;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;}
.db-lbl{font-size:10px;opacity:.7;}
.my-rating-badge{display:inline-flex;align-items:center;gap:2px;background:#fefce8;border:1px solid #fde68a;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:#a16207;}

/* Category badge colors */
.cat-文学{background:#fce7f3;color:#9d174d;}
.cat-推理{background:#e2e8f0;color:#1e293b;}
.cat-历史{background:#fef9c3;color:#854d0e;}
.cat-科幻{background:#dbeafe;color:#1e40af;}
.cat-惊悚{background:#fce7e7;color:#7f1d1d;}
.cat-政经{background:#dcfce7;color:#14532d;}
.cat-哲学{background:#ede9fe;color:#5b21b6;}
.cat-艺术{background:#ffedd5;color:#9a3412;}
.cat-other{background:#f1f5f9;color:#475569;}

/* Stars */
.stars{display:flex;gap:1px;}
.star{font-size:17px;cursor:pointer;user-select:none;transition:color .12s;}
.star.on{color:#f59e0b;}
.star.off{color:#e2e8f0;}
.star.ro{cursor:default;}

/* Empty */
.empty{text-align:center;padding:56px 20px;color:#c9c2ba;border:2px dashed var(--border3);border-radius:16px;margin-top:8px;background:var(--bg3);}
.empty-icon{font-size:44px;margin-bottom:12px;}
.empty-t1{font-size:16px;color:var(--text4);margin-bottom:5px;}
.empty-t2{font-size:13px;}

/* Modals */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.44);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;animation:fadeIn .18s ease;}
.modal{background:var(--bg3);border-radius:20px;padding:30px;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.16);animation:slideUp .22s cubic-bezier(.4,0,.2,1);}
.modal-sm{max-width:460px;}
.modal-xs{max-width:300px;text-align:center;}
.modal h2{font-family:'Playfair Display',serif;font-size:18px;color:var(--text);margin-bottom:3px;}
.modal-hdr{display:flex;gap:18px;margin-bottom:22px;align-items:flex-start;}
.modal-ftr{display:flex;gap:10px;margin-top:22px;justify-content:flex-end;}
.slabel{font-size:11px;font-weight:700;color:var(--text4);letter-spacing:.08em;display:block;margin-bottom:6px;margin-top:4px;}
.form-row{display:flex;gap:12px;margin-bottom:14px;}
.form-row>div{flex:1;}
.fg{margin-bottom:14px;}
.fg label{font-size:12px;color:#8c8680;display:block;margin-bottom:5px;font-weight:600;}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.status-btn{cursor:pointer;border:1.5px solid var(--border2);border-radius:20px;font-size:13px;font-family:inherit;padding:9px 0;transition:all .16s;background:#f8f6f3;color:#94a3b8;}
.status-btn.active{font-weight:700;}
.ctag-box{background:#faf8ff;border:1.5px dashed #c4b5fd;border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.ctag-box>label{color:#6d28d9;font-size:12px;display:block;margin-bottom:6px;font-weight:700;}
.ctag-box p{margin:5px 0 0;font-size:11px;color:#a78bfa;}
.cu-box{background:#f8faff;border:1.5px dashed #bfdbfe;border-radius:10px;padding:12px 14px;margin-bottom:14px;}
.cu-box>label{color:#2563eb;font-size:12px;display:block;margin-bottom:8px;font-weight:700;}
.cu-row{display:flex;gap:12px;align-items:center;}
.drop-zone{flex:1;border:1.5px dashed #93c5fd;border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;background:#eff6ff;transition:background .15s;}
.drop-zone:hover,.drag-over{background:#dbeafe!important;border-color:#3b82f6!important;}
.dz-icon{font-size:22px;margin-bottom:4px;}
.dz-t1{font-size:12px;color:#3b82f6;font-weight:600;}
.dz-t2{font-size:11px;color:#93c5fd;margin-top:2px;}
.cu-preview{width:52px;height:74px;border-radius:6px;flex-shrink:0;border:1.5px solid #bfdbfe;overflow:hidden;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:20px;color:#94a3b8;}
.cu-preview img{width:100%;height:100%;object-fit:cover;}
.cu-del-row{display:flex;justify-content:flex-end;margin-top:8px;}
.del-cover-btn{background:#fff1f2;color:#e11d48;border:none;border-radius:6px;padding:4px 12px;font-size:12px;cursor:pointer;}
.cu-hint{margin:6px 0 0;font-size:11px;color:#93c5fd;}
.view-notes{background:var(--bg2);border:1.5px solid var(--border);border-radius:10px;padding:13px 15px;color:var(--text2);font-size:14px;line-height:1.8;margin-bottom:16px;white-space:pre-wrap;}

/* Book serial number — elegant pill badge tucked at bottom-left of cover */
.cover-wrap{position:relative;flex-shrink:0;}
.book-no{
  position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
  z-index:10;
  min-width:24px;padding:2px 6px;
  border-radius:20px;
  background:rgba(255,255,255,0.95);
  color:var(--accent);
  font-size:10px;font-weight:700;
  font-family:'Playfair Display',serif;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 6px rgba(79,70,229,0.22), 0 0 0 1.5px rgba(79,70,229,0.18);
  line-height:1.2;letter-spacing:0.02em;
  white-space:nowrap;
}

/* Library rename */
#lib-name-wrap{display:flex;align-items:center;gap:8px;}
#lib-name{font-family:'Playfair Display','Noto Serif SC',serif;font-size:27px;font-weight:700;color:var(--text);letter-spacing:.04em;cursor:pointer;border-bottom:1.5px dashed transparent;transition:border-color .18s;padding-bottom:1px;}
#lib-name:hover{border-color:rgba(79,70,229,.35);}
#lib-name-input{font-family:'Playfair Display','Noto Serif SC',serif;font-size:27px;font-weight:700;color:var(--text);letter-spacing:.04em;background:transparent;border:none;border-bottom:2px solid var(--accent);outline:none;padding-bottom:1px;width:auto;min-width:80px;max-width:420px;display:none;}
.rename-btn{background:transparent;border:none;cursor:pointer;font-size:14px;color:var(--text4);padding:2px 4px;border-radius:4px;transition:all .15s;flex-shrink:0;}
.rename-btn:hover{color:var(--accent);background:var(--accent-bg);}
.rename-confirm{background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px;padding:3px 10px;font-family:inherit;display:none;transition:all .15s;}
.rename-confirm:hover{filter:brightness(.9);}
.rename-cancel{background:#f1ede8;color:#8c8680;border:none;border-radius:6px;cursor:pointer;font-size:12px;padding:3px 8px;font-family:inherit;display:none;}
.btn-excel{background:#fff;color:#15803d;border:1.5px solid #86efac;padding:7px 14px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .16s;display:inline-flex;align-items:center;gap:5px;}
.btn-excel:hover{background:#f0fdf4;border-color:#16a34a;}
#io-bar{max-width:940px;margin:0 auto;padding:10px 24px 0;display:flex;justify-content:flex-end;gap:8px;}
.btn-export{background:#fff;color:#16a34a;border:1.5px solid #bbf7d0;padding:7px 14px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .16s;display:inline-flex;align-items:center;gap:5px;}
.btn-export:hover{background:#f0fdf4;border-color:#16a34a;}
.btn-import{background:#fff;color:#2563eb;border:1.5px solid #bfdbfe;padding:7px 14px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .16s;display:inline-flex;align-items:center;gap:5px;}
.btn-import:hover{background:#eff6ff;border-color:#2563eb;}

/* Import modal */
.import-drop{border:2px dashed #bfdbfe;border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;background:#f8faff;transition:background .15s;margin-bottom:14px;}
.import-drop:hover,.import-drop.drag-over{background:#dbeafe;border-color:#3b82f6;}
.import-drop-icon{font-size:32px;margin-bottom:8px;}
.import-drop-t1{font-size:14px;color:#2563eb;font-weight:600;margin-bottom:4px;}
.import-drop-t2{font-size:12px;color:#93c5fd;}
.import-info{background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:8px;padding:10px 14px;font-size:13px;color:#15803d;margin-bottom:14px;display:none;}
.import-warn{background:#fef3c7;border:1.5px solid #fcd34d;border-radius:8px;padding:10px 14px;font-size:13px;color:#92400e;margin-bottom:14px;display:none;}
.import-mode-row{display:flex;gap:8px;margin-bottom:16px;}
.import-mode-btn{flex:1;padding:9px 0;font-size:13px;border:1.5px solid var(--border2);border-radius:8px;cursor:pointer;background:#f8f6f3;color:#94a3b8;font-family:inherit;transition:all .16s;}
.import-mode-btn.active{background:#eef2ff;color:var(--accent);border-color:var(--accent);font-weight:600;}

/* Custom category */
.custom-cat-box{background:#faf8ff;border:1.5px dashed #c4b5fd;border-radius:10px;padding:11px 14px;margin-top:8px;}
.custom-cat-box label{color:#6d28d9;font-size:12px;display:block;margin-bottom:6px;font-weight:700;}
.custom-cat-box p{margin:5px 0 0;font-size:11px;color:#a78bfa;}
/* Field error */
.field-error{border-color:#e11d48!important;box-shadow:0 0 0 3px rgba(225,29,72,.12)!important;}
.error-msg{font-size:11px;color:#e11d48;margin-top:4px;display:none;}
.error-msg.show{display:block;}

/* iCloud sync */
.btn-icloud{background:#fff;color:#0071e3;border:1.5px solid #90c8f8;padding:7px 14px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .16s;display:inline-flex;align-items:center;gap:5px;}
.btn-icloud:hover{background:#f0f8ff;border-color:#0071e3;}
#sync-status{font-size:11px;padding:4px 10px;border-radius:20px;display:none;align-items:center;gap:5px;font-weight:500;}
#sync-status.linked{display:inline-flex;background:#f0f8ff;color:#0071e3;border:1px solid #90c8f8;}
#sync-status.saving{display:inline-flex;background:#fef9c3;color:#854d0e;border:1px solid #fde68a;}
#sync-status.saved{display:inline-flex;background:#f0fdf4;color:#15803d;border:1px solid #86efac;}
#sync-status.error{display:inline-flex;background:#fff1f2;color:#be123c;border:1px solid #fda4af;}

/* Toast */
#toast{position:fixed;bottom:28px;right:28px;z-index:300;background:#f0fdf4;border:1.5px solid #16a34a;color:#16a34a;padding:10px 20px;border-radius:10px;font-size:13px;box-shadow:0 4px 14px rgba(22,163,74,.15);display:none;}
#toast.show{display:block;animation:tIn .28s ease;}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
@keyframes tIn{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>

<div id="header">
  <div class="inner">
    <div id="lib-name-wrap">
      <span style="font-size:28px;">📚</span>
      <span id="lib-name" onclick="startRename()" title="点击重命名书库"></span>
      <input id="lib-name-input" maxlength="30" onkeydown="onRenameKey(event)" oninput="autoResizeInput()"/>
      <button class="rename-btn" id="rename-edit-btn" onclick="startRename()" title="重命名书库">✏️</button>
      <button class="rename-confirm" id="rename-ok" onclick="confirmRename()">确定</button>
      <button class="rename-cancel" id="rename-cancel" onclick="cancelRename()">✕</button>
      <span class="h1-sub" id="lib-sub">PERSONAL LIBRARY</span>
    </div>
    <p id="subtitle">你的私人阅读宇宙 · 0 册藏书</p>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div id="io-bar">
  <span id="sync-status"></span>
  <button class="btn-icloud" id="icloud-btn" onclick="handleIcloudBtn()" title="关联 iCloud Drive 文件，实现多端同步">☁ 关联iCloud同步</button>
  <button class="btn-import" onclick="openImport()">⬆ 导入备份</button>
  <button class="btn-export" onclick="exportData()">⬇ 导出备份</button>
  <button class="btn-excel" onclick="exportExcel()">📊 汇总数据</button>
</div>

<div id="controls">
  <div class="ctrl-row">
    <input id="search-input" placeholder="🔍  搜索书名、作者…" oninput="render()"/>
    <select id="sort-select" onchange="render()">
      <option value="addedDate">添加日期</option>
      <option value="title">书名</option>
      <option value="rating">我的评分</option>
      <option value="douban">豆瓣评分</option>
      <option value="year">出版年份</option>
    </select>
    <button id="sort-dir-btn" onclick="toggleSortDir()" title="切换升序/降序"
      style="background:#fff;color:#64748b;border:1.5px solid #e0d9d0;padding:9px 12px;font-size:14px;border-radius:8px;cursor:pointer;font-family:inherit;transition:all .16s;white-space:nowrap;">
      ↓ 降序
    </button>
    <button class="btn" id="filter-btn" onclick="toggleFilter()" style="background:#fff;color:#64748b;border:1.5px solid #e0d9d0;padding:9px 16px;font-size:13px;">
      ⚙ 筛选 <span id="filter-badge" style="display:none;background:#f59e0b;color:#fff;border-radius:10px;padding:0 5px;font-size:11px;font-weight:700;"></span>
    </button>
    <button class="btn btn-primary" onclick="openAdd()">＋ 添加书籍</button>
  </div>
  <div class="cats" id="cats"></div>

  <div id="filter-panel">

const CATEGORIES=["全部","文学","推理","历史","科幻","惊悚","政经","哲学","艺术"];

const COVER_PALETTES={
  "文学":[["#f9a8d4","#be185d"],["#fda4af","#9f1239"],["#c4b5fd","#6d28d9"]],
  "推理":[["#94a3b8","#1e293b"],["#cbd5e1","#334155"],["#7dd3fc","#0c4a6e"]],

  "其他":[["#e2e8f0","#94a3b8"],["#fecdd3","#9f1239"],["#bfdbfe","#1e3a8a"]],
};
const CAT_ICONS={"文学":"✍️","推理":"🔍","历史":"🏛️","科幻":"🚀","惊悚":"🌑","政经":"📊","哲学":"🌀","艺术":"🎨","其他":"📖"};

let books=JSON.parse(localStorage.getItem("library_books")||"[]");
let filterCat="全部",filterStatus="全部",filterMinRating=0,sortDir="desc";
let editingId=null,editRating=0,currentCoverData="";
let viewingId=null,deleteTargetId=null;

// ── File System Access API (iCloud sync) ─────────────────────────────────────
const FS_SUPPORTED = typeof window.showOpenFilePicker === "function";
let fileHandle = null;        // current linked file handle
let saveDebounceTimer = null;

// Restore file handle from IndexedDB across page reloads
const DB_NAME = "zangshuge_fs", DB_STORE = "handles";
function openHandleDB(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
    req.onsuccess = e => res(e.target.result);
    req.onerror = () => rej();
  });
}
async function saveHandleToDB(h){
  try{ const db=await openHandleDB(); const tx=db.transaction(DB_STORE,"readwrite"); tx.objectStore(DB_STORE).put(h,"fh"); }catch{}
}
async function loadHandleFromDB(){
  try{
    const db=await openHandleDB();
    return new Promise(res=>{
      const tx=db.transaction(DB_STORE,"readonly");
      const req=tx.objectStore(DB_STORE).get("fh");
      req.onsuccess=e=>res(e.target.result||null);
      req.onerror=()=>res(null);
    });
  }catch{return null;}
}
async function clearHandleDB(){
  try{ const db=await openHandleDB(); const tx=db.transaction(DB_STORE,"readwrite"); tx.objectStore(DB_STORE).delete("fh"); }catch{}
}

// Write books array to the linked file
async function writeToFile(data){
  if(!fileHandle) return false;
  try{
    const writable = await fileHandle.createWritable();
    const payload = {version:1, exportedAt:new Date().toISOString(), count:data.length, books:data};
    await writable.write(JSON.stringify(payload, null, 2));
    await writable.close();
    return true;
  }catch(e){
    console.warn("writeToFile failed", e);
    return false;
  }
}

// Read books from the linked file
async function readFromFile(){
  if(!fileHandle) return null;
  try{
    const file = await fileHandle.getFile();
    const text = await file.text();
    const parsed = JSON.parse(text);
    return Array.isArray(parsed) ? parsed : (parsed.books || null);
  }catch{return null;}
}

// Update sync status UI
function setSyncStatus(state, label){
  const el = document.getElementById("sync-status");
  const btn = document.getElementById("icloud-btn");
  el.className = ""; // reset
  if(state === "linked"){
    el.className = "linked"; el.textContent = `☁ 已关联：${label}`;
    btn.textContent = "☁ 断开同步"; btn.title="断开iCloud文件关联";
  } else if(state === "saving"){
    el.className = "saving"; el.textContent = "⏳ 同步中…";
  } else if(state === "saved"){
    el.className = "saved"; el.textContent = "✓ 已同步";
    setTimeout(()=>{ if(el.className==="saved"){ el.className="linked"; el.textContent=`☁ 已关联：${label||"文件"}`; } },2000);
  } else if(state === "error"){
    el.className = "error"; el.textContent = "⚠ 同步失败";
  } else {
    el.className = ""; el.style.display = "none";
    btn.textContent = "☁ 关联iCloud同步"; btn.title="关联 iCloud Drive 文件，实现多端同步";
  }
}

let linkedFileName = "";

// Main save: always write to localStorage, also write to file if linked
const save = (skipToast) => {
  localStorage.setItem("library_books", JSON.stringify(books));
  if(!skipToast) showToast("✓ 已保存");
  if(fileHandle){
    setSyncStatus("saving", linkedFileName);
    clearTimeout(saveDebounceTimer);
    saveDebounceTimer = setTimeout(async ()=>{
      const ok = await writeToFile(books);
      setSyncStatus(ok ? "saved" : "error", linkedFileName);
    }, 600);
  }
};

// Handle iCloud button click
async function handleIcloudBtn(){
  if(!FS_SUPPORTED){
    alert("你的浏览器不支持文件系统访问（请使用 Mac/Windows 上的 Chrome 或 Edge）。\n\n可以使用「导入/导出备份」手动同步。");
    return;
  }
  if(fileHandle){
    // Disconnect
    fileHandle = null; linkedFileName = "";
    await clearHandleDB();
    setSyncStatus("none");
    showToast("已断开文件关联");
    return;
  }
  // Show picker: open existing or create new
  const choice = confirm(
    "关联 iCloud Drive 同步文件\n\n" +
    "• 点「确定」→ 选择已有的备份 .json 文件（推荐选 iCloud Drive 里的文件）\n" +
    "• 点「取消」→ 创建一个新的同步文件\n\n" +
    "首次使用建议先「导出备份」到 iCloud Drive，然后再关联该文件。"
  );
  try{
    if(choice){
      // Open existing
      const [h] = await window.showOpenFilePicker({
        types:[{description:"JSON备份文件",accept:{"application/json":[".json"]}}],
        multiple:false
      });
      fileHandle = h;
      linkedFileName = h.name;
      // Read and merge data from file
      const data = await readFromFile();
      if(data && data.length > 0){
        const merge = confirm(`文件中有 ${data.length} 册书籍数据。\n\n• 确定 → 合并到当前书库（推荐）\n• 取消 → 保留当前书库，仅写入`);
        if(merge){
          const map = new Map(books.map(b=>[b.id,b]));
          data.forEach(b=>map.set(b.id,b));
          books = [...map.values()].sort((a,b2)=>b2.id-a.id);
          localStorage.setItem("library_books", JSON.stringify(books));
          render();
        }
      }
    } else {
      // Create new file
      const h = await window.showSaveFilePicker({
        suggestedName:`藏书阁同步_${new Date().toISOString().slice(0,10)}.json`,
        types:[{description:"JSON备份文件",accept:{"application/json":[".json"]}}]
      });
      fileHandle = h;
      linkedFileName = h.name;
    }
    await saveHandleToDB(fileHandle);
    await writeToFile(books);
    setSyncStatus("linked", linkedFileName);
    showToast(`✓ 已关联：${linkedFileName}`);
  }catch(e){
    if(e.name !== "AbortError") showToast("⚠ 关联失败：" + e.message);
  }
}

// On page load: restore file handle and auto-read
async function initFileSync(){
  if(!FS_SUPPORTED){
    document.getElementById("icloud-btn").title = "当前浏览器不支持（请用 Chrome/Edge）";
    document.getElementById("icloud-btn").style.opacity = "0.45";
    document.getElementById("icloud-btn").style.cursor = "not-allowed";
    return;
  }
  const h = await loadHandleFromDB();
  if(!h) return;
  // Verify permission
  try{
    const perm = await h.queryPermission({mode:"readwrite"});
    if(perm === "granted"){
      fileHandle = h; linkedFileName = h.name;
      setSyncStatus("linked", linkedFileName);
      // Auto-read: if file is newer, offer to load
      const data = await readFromFile();
      if(data && data.length > 0 && data.length !== books.length){
        const map = new Map(books.map(b=>[b.id,b]));
        data.forEach(b=>map.set(b.id,b));
        books = [...map.values()].sort((a,b2)=>b2.id-a.id);
        localStorage.setItem("library_books", JSON.stringify(books));
        render();
        showToast(`✓ 已从 ${linkedFileName} 同步 ${books.length} 册`);
      }
    } else if(perm === "prompt"){
      // Will ask on next user interaction
      fileHandle = h; linkedFileName = h.name;
      setSyncStatus("linked", linkedFileName + "（需重新授权）");
    }
  }catch{ await clearHandleDB(); }
}

function buildCoverEl(book,size){
  const h=Math.round(size*1.42);
  const wrap=document.createElement("div");
  wrap.className="cover";
  wrap.style.cssText=`width:${size}px;height:${h}px;`;
  if(book.coverData){
    // Photo cover: pure image, no spine, no shadow
    wrap.style.borderRadius="5px";
    wrap.style.overflow="hidden";
    const img=document.createElement("img");
    img.src=book.coverData;img.alt=book.title||"";
    wrap.appendChild(img);
  } else {
    // Generated gradient cover: keep spine decoration
    const spine=document.createElement("div");
    spine.className="cover-spine";
    spine.style.width=Math.max(4,size*.1)+"px";
    wrap.appendChild(spine);
    const p=COVER_PALETTES[book.category]||COVER_PALETTES["其他"];
    const[top,bot]=p[(book.id||0)%p.length];
    wrap.style.background=`linear-gradient(155deg,${top} 0%,${bot} 100%)`;
    wrap.style.boxShadow="2px 4px 12px rgba(0,0,0,0.14),inset -3px 0 5px rgba(0,0,0,0.10)";
    wrap.classList.add("cover-gen");
    const icon=document.createElement("span");
    icon.style.cssText=`font-size:${size*.36}px;line-height:1;z-index:1;`;
    icon.textContent=CAT_ICONS[book.category]||"📖";
    wrap.appendChild(icon);
    if(book.title){
      const t=document.createElement("div");
      t.className="cover-gen-title";
      t.style.cssText=`font-size:${Math.max(7,size*.12)}px;max-width:${size-8}px;z-index:1;`;
      t.textContent=book.title;wrap.appendChild(t);
    }
  }
  return wrap;
}

function buildStars(value,readonly,onChange){
  const wrap=document.createElement("div");
  wrap.className="stars";
  for(let s=1;s<=5;s++){
    const sp=document.createElement("span");
    sp.className="star "+(s<=value?"on":"off")+(readonly?" ro":"");
    sp.textContent="★";
    if(!readonly)sp.onclick=()=>{const nv=s===value?0:s;onChange(nv);};
    wrap.appendChild(sp);
  }
  return wrap;
}

function renderStats(){
  const defs=[
    {k:"全部",v:books.length,c:"#4f46e5",bg:"#eef2ff"},
    {k:"已读",v:books.filter(b=>b.status==="已读").length,c:"#16a34a",bg:"#dcfce7"},
    {k:"阅读中",v:books.filter(b=>b.status==="阅读中").length,c:"#d97706",bg:"#fef3c7"},
    {k:"未读",v:books.filter(b=>b.status==="未读").length,c:"#64748b",bg:"#f1f5f9"},
    {k:"搁置",v:books.filter(b=>b.status==="搁置").length,c:"#9333ea",bg:"#f3e8ff"},
  ];
  const el=document.getElementById("stats");el.innerHTML="";
  defs.forEach(({k,v,c,bg})=>{
    const d=document.createElement("div");
    d.className="stat-card";
    d.style.background=bg;
    d.style.border=filterStatus===k?`2px solid ${c}`:"2px solid transparent";
    d.style.boxShadow=filterStatus===k?`0 0 0 2px ${c}22`:"none";
    d.innerHTML=`<div class="stat-num" style="color:${c}">${v}</div><div class="stat-lbl" style="color:${c}">${k}</div>`;
    d.onclick=()=>{filterStatus=k;render();};
    el.appendChild(d);
  });
}

function getCustomCats(){
  // collect all unique customTag values in use across books
  const set=new Set();
  books.forEach(b=>{if(b.customTag&&b.customTag.trim())set.add(b.customTag.trim());});
  return [...set].sort();
}

function renderCats(){
  const el=document.getElementById("cats");el.innerHTML="";
  const allCats=["全部",...CATEGORIES.slice(1),...getCustomCats()];
  if(filterCat!=="全部"&&!allCats.includes(filterCat))filterCat="全部";

  // Count only books that match the current status filter
  const statusFiltered=filterStatus==="全部"?books:books.filter(b=>b.status===filterStatus);

  const countMap={};
  allCats.forEach(c=>countMap[c]=0);
  countMap["全部"]=statusFiltered.length;
  statusFiltered.forEach(b=>{
    const display=b.customTag||b.category;
    if(countMap[display]!==undefined)countMap[display]++;
    else countMap[display]=1;
  });

  allCats.forEach(c=>{
    const btn=document.createElement("button");
    btn.className="tag-btn"+(filterCat===c?" active":"");
    const cnt=countMap[c]||0;
    btn.textContent=c==="全部"?`全部 (${cnt})`:cnt>0?`${c} (${cnt})`:c;
    btn.onclick=()=>{filterCat=c;render();};
    el.appendChild(btn);
  });
}

function getFiltered(){
  const q=document.getElementById("search-input").value.toLowerCase();
  const sort=document.getElementById("sort-select").value;
  const dbMinV=document.getElementById("f-db-min").value;
  const dbMaxV=document.getElementById("f-db-max").value;
  const yFromV=document.getElementById("f-year-from").value;
  const yToV=document.getElementById("f-year-to").value;
  const dFrom=document.getElementById("f-date-from").value||"";
  const dTo=document.getElementById("f-date-to").value||"";
  let list=books.filter(b=>{
    if(filterCat!=="全部"){
      // match either standard category or customTag
      const inStd=b.category===filterCat;
      const inCustom=b.customTag===filterCat;
      if(!inStd&&!inCustom)return false;
    }
    if(filterStatus!=="全部"&&b.status!==filterStatus)return false;
    if(q&&!b.title.toLowerCase().includes(q)&&!(b.author||"").toLowerCase().includes(q))return false;
    if(dbMinV&&parseFloat(b.doubanScore||0)<parseFloat(dbMinV))return false;
    if(dbMaxV&&parseFloat(b.doubanScore||99)>parseFloat(dbMaxV))return false;
    if(filterMinRating>0&&b.rating<filterMinRating)return false;
    if(yFromV&&parseInt(b.year||0)<parseInt(yFromV))return false;
    if(yToV&&parseInt(b.year||9999)>parseInt(yToV))return false;
    if(dFrom&&b.addedDate&&b.addedDate<dFrom)return false;
    if(dTo&&b.addedDate&&b.addedDate>dTo)return false;
    return true;
  });
  const d=sortDir==="asc"?1:-1;
  list.sort((a,b)=>{
    if(sort==="title")return d*a.title.localeCompare(b.title);
    if(sort==="rating")return d*(a.rating-b.rating);
    if(sort==="douban")return d*(parseFloat(a.doubanScore||0)-parseFloat(b.doubanScore||0));
    if(sort==="year")return d*(parseInt(a.year||0)-parseInt(b.year||0));
    if(sort==="addedDate")return d*(a.addedDate||"").localeCompare(b.addedDate||"");
    return d*(a.id-b.id);
  });
  return list;
}

function renderBooks(){
  const el=document.getElementById("book-list");el.innerHTML="";
  const list=getFiltered();
  if(!list.length){
    el.innerHTML=`<div class="empty"><div class="empty-icon">📖</div><div class="empty-t1">${books.length===0?"书架还空着":"没有找到匹配的书籍"}</div><div class="empty-t2">${books.length===0?"点击「添加书籍」开始记录你的藏书":"换个条件试试"}</div></div>`;
    return;
  }
  list.forEach((b, idx)=>{
    const card=document.createElement("div");card.className="book-card";
    card.onclick=()=>openView(b.id);

    // Cover + serial number badge
    const wrap=document.createElement("div");wrap.className="cover-wrap";
    wrap.style.marginBottom="8px";
    const no=document.createElement("div");no.className="book-no";
    no.textContent=idx+1;
    wrap.appendChild(buildCoverEl(b,48));
    wrap.appendChild(no);
    card.appendChild(wrap);
    const info=document.createElement("div");info.className="book-info";
    const ds=parseFloat(b.doubanScore||0);
    const dc=ds>=8?"#e67e22":ds>=6?"#27ae60":"#e74c3c";

    // Row 1: title (truncated) + status badge — no wrap
    const row1=document.createElement("div");row1.className="book-row1";
    row1.innerHTML=`<span class="book-title-text">${b.title}</span>
      <span class="badge book-status-badge" style="background:${STATUS_BG[b.status]};color:${STATUS_COLORS[b.status]}">${b.status}</span>`;
    info.appendChild(row1);

    // Row 2: category + douban badge + my rating badge
    const CAT_CLASS={"文学":"cat-文学","推理":"cat-推理","历史":"cat-历史","科幻":"cat-科幻","惊悚":"cat-惊悚","政经":"cat-政经","哲学":"cat-哲学","艺术":"cat-艺术"};
    const catCls=CAT_CLASS[getDisplayCat(b)]||"cat-other";
    const row2=document.createElement("div");row2.className="book-row2";
    row2.innerHTML=`<span class="badge ${catCls}">${getDisplayCat(b)}</span>
      ${b.doubanScore?`<span class="db-badge" style="color:${dc};border:1px solid ${dc}44"><span class="db-lbl">豆瓣</span>${b.doubanScore}</span>`:""}
      ${b.rating>0?`<span class="my-rating-badge">${b.rating}🌟</span>`:""}`;
    info.appendChild(row2);

    // Row 3: author · year (single line, truncated)
    if(b.author||b.year){
      const m=document.createElement("div");m.className="book-meta-line";
      const parts=[];
      if(b.author)parts.push(b.author);
      if(b.year)parts.push(b.year);
      m.textContent=parts.join(" · ");
      info.appendChild(m);
    }

    // Row 4: pages · added date on its own line
    if(b.addedDate||b.pages){
      const dl=document.createElement("div");dl.className="book-date-line";
      const parts=[];
      if(b.pages)parts.push(`${b.pages}页`);
      if(b.addedDate)parts.push(`${fmtDate(b.addedDate)} 添加`);
      dl.textContent=parts.join(" · ");
      info.appendChild(dl);
    }

    card.appendChild(info);
    const acts=document.createElement("div");acts.className="book-actions";
    const eb=document.createElement("button");eb.className="btn btn-edit";eb.textContent="编辑";eb.onclick=e=>{e.stopPropagation();openEdit(b.id);};
    const db=document.createElement("button");db.className="btn btn-danger";db.textContent="删除";db.onclick=e=>{e.stopPropagation();confirmDelete(b.id);};
    acts.appendChild(eb);acts.appendChild(db);
    card.appendChild(acts);el.appendChild(card);
  });
}

  document.getElementById("modal-title-text").textContent="编辑书籍";

  document.getElementById("douban-err").classList.remove("show");
  document.getElementById("f-notes").value=b.notes||"";

function handleFile(file){
  if(!file||!file.type.startsWith("image/"))return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const maxW=400,scale=img.width>maxW?maxW/img.width:1;
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);
      canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
      currentCoverData=canvas.toDataURL("image/jpeg",.85);
      updateCoverPreview();updateCoverUploadUI();
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}
function handleFileInput(e){handleFile(e.target.files[0]);}
function handleDrop(e){e.preventDefault();document.getElementById("drop-zone").classList.remove("drag-over");handleFile(e.dataTransfer.files[0]);}

function validateDouban(){
  const inp=document.getElementById("f-douban");
  const err=document.getElementById("douban-err");
  const v=inp.value;
  if(v===""){ inp.classList.remove("field-error"); err.classList.remove("show"); return true; }
  const n=parseFloat(v);
  // Must be 0-10, and at most 1 decimal place
  if(isNaN(n)||n<0||n>10||!/^\d+(\.\d)?$/.test(v.trim())){
    inp.classList.add("field-error");
    err.textContent="请输入 0–10 之间的数字（最多一位小数）";
    err.classList.add("show"); return false;
  }
  inp.classList.remove("field-error"); err.classList.remove("show"); return true;
}

function saveBook(){
  const title=document.getElementById("f-title").value.trim();
  if(!title){
    const inp=document.getElementById("f-title");
    inp.classList.add("field-error");inp.focus();
    setTimeout(()=>inp.classList.remove("field-error"),2000);
    return;
  }
  if(!validateDouban())return;

  const catSel=document.getElementById("f-category").value;
  const customTag=document.getElementById("f-custom-tag").value.trim();

  // Validate custom cat
  if(catSel==="__custom__"&&!customTag){
    const inp=document.getElementById("f-custom-tag");
    inp.classList.add("field-error");inp.focus();
    setTimeout(()=>inp.classList.remove("field-error"),2000);
    showToast("⚠ 请填写自定义分类名称");return;
  }

  // Determine stored category: custom tags stored in customTag field, category = closest standard or "其他"
  const stdCats=["文学","推理","惊悚","历史","科学","政经","哲学","艺术"];
  const cat=catSel==="__custom__"?"其他":catSel;
  const storedCustomTag=catSel==="__custom__"?customTag:"";

  const doubanRaw=document.getElementById("f-douban").value;
  const book={
    id:editingId||Date.now(),title,
    author:document.getElementById("f-author").value.trim(),
    year:document.getElementById("f-year").value.trim(),
    pages:document.getElementById("f-pages").value.trim(),
    category:cat,
    customTag:storedCustomTag,
    addedDate:document.getElementById("f-added-date").value,
    doubanScore:doubanRaw,
    notes:document.getElementById("f-notes").value.trim(),
    rating:editRating,status:getSelectedStatus(),coverData:currentCoverData,
  };
  if(editingId){books=books.map(b=>b.id===editingId?book:b);}
  else{books.unshift(book);}
  save();closeEdit();render();
}

  else vp.style.display="none";  const vn=document.getElementById("view-notes");
  if(b.notes){vn.textContent=b.notes;vn.style.display="block";}else vn.style.display="none";
  document.getElementById("modal-view").style.display="flex";

function exportData(){
  if(!books.length){alert("书库是空的，没有可导出的数据。");return;}
  const ts=new Date().toISOString().slice(0,10);
  const payload={version:1,exportedAt:new Date().toISOString(),count:books.length,books};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=`${libName}_备份_${ts}.json`;
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  showToast("✓ 已导出 " + books.length + " 册书籍");
}

let importData=null;
let importMode="merge";

function setImportMode(mode){
  importMode=mode;
  document.getElementById("mode-btn-merge").className="import-mode-btn"+(mode==="merge"?" active":"");
  document.getElementById("mode-btn-replace").className="import-mode-btn"+(mode==="replace"?" active":"");
  document.getElementById("mode-desc").textContent=mode==="merge"
    ?"将备份中的书籍与现有书库合并，相同 ID 的书籍以备份为准。"

function handleImportFile(e){const file=e.target.files[0];if(file)parseImportFile(file);}

function parseImportFile(file){
  if(!file.name.endsWith(".json")){
    showImportWarn("请选择 .json 格式的备份文件。");return;
  }
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      const bks=parsed.books||parsed; // support both {version,books} and raw array
      if(!Array.isArray(bks)||bks.length===0){showImportWarn("文件格式不正确或备份为空。");return;}
      importData=bks;
      const info=document.getElementById("import-info");
      info.textContent=`✓ 解析成功：共 ${bks.length} 册书籍（导出于 ${parsed.exportedAt?parsed.exportedAt.slice(0,10):"未知日期"}）`;
      info.style.display="block";
      document.getElementById("import-warn").style.display="none";
      document.getElementById("import-mode-wrap").style.display="block";
      document.getElementById("import-confirm-btn").style.display="inline-flex";
    }catch{showImportWarn("文件解析失败，请确认是有效的备份文件。");}
  };
  reader.readAsText(file);
}

function showImportWarn(msg){
  importData=null;
  const w=document.getElementById("import-warn");
  w.textContent="⚠ "+msg;w.style.display="block";
  document.getElementById("import-info").style.display="none";
  document.getElementById("import-mode-wrap").style.display="none";
  document.getElementById("import-confirm-btn").style.display="none";
}

function doImport(){
  if(!importData)return;
  if(importMode==="replace"){
    if(!confirm(`确定要覆盖当前 ${books.length} 册书籍，替换为备份中的 ${importData.length} 册？此操作不可恢复。`))return;
    books=importData;
  } else {
    // merge: backup wins on same id
    const map=new Map(books.map(b=>[b.id,b]));
    importData.forEach(b=>map.set(b.id,b));
    books=[...map.values()].sort((a,b2)=>b2.id-a.id);
  }
  save();closeImport();render();
  showToast(`✓ 导入成功，书库现有 ${books.length} 册`);
}

// ── Library rename ────────────────────────────────────────────────────────────
let libName=localStorage.getItem("library_name")||"藏书阁";

function applyLibName(){
  document.getElementById("lib-name").textContent=libName;
  document.title=libName;
}

function autoResizeInput(){
  const inp=document.getElementById("lib-name-input");
  let ruler=document.getElementById("_ruler");
  if(!ruler){ruler=document.createElement("span");ruler.id="_ruler";ruler.style.cssText="position:absolute;visibility:hidden;white-space:pre;font-family:'Playfair Display','Noto Serif SC',serif;font-size:27px;font-weight:700;letter-spacing:.04em;";document.body.appendChild(ruler);}
  ruler.textContent=inp.value||"　";
  inp.style.width=Math.min(Math.max(ruler.offsetWidth+4,80),420)+"px";
}

function startRename(){
  const inp=document.getElementById("lib-name-input");
  inp.value=libName;
  document.getElementById("lib-name").style.display="none";
  document.getElementById("rename-edit-btn").style.display="none";
  document.getElementById("lib-sub").style.display="none";
  inp.style.display="inline";
  document.getElementById("rename-ok").style.display="inline-flex";
  document.getElementById("rename-cancel").style.display="inline";
  autoResizeInput();
  inp.focus();inp.select();
}

function confirmRename(){
  const val=document.getElementById("lib-name-input").value.trim();
  if(val){libName=val;localStorage.setItem("library_name",libName);}
  cancelRename();applyLibName();
  showToast("✓ 书库已重命名为「"+libName+"」");
}

function cancelRename(){
  document.getElementById("lib-name-input").style.display="none";
  document.getElementById("rename-ok").style.display="none";
  document.getElementById("rename-cancel").style.display="none";
  document.getElementById("lib-name").style.display="inline";
  document.getElementById("rename-edit-btn").style.display="inline";
  document.getElementById("lib-sub").style.display="inline";
}

function onRenameKey(e){
  if(e.key==="Enter")confirmRename();
  if(e.key==="Escape")cancelRename();
}

applyLibName();

// ── Export Excel ──────────────────────────────────────────────────────────────
function exportExcel(){
  if(!books.length){showToast("⚠ 书库是空的，没有可导出的数据");return;}

  // Load SheetJS on demand (CDN, ~250 KB)
  if(window.XLSX){doExportExcel();return;}
  const s=document.createElement("script");
  s.src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js";
  s.onload=doExportExcel;
  s.onerror=()=>showToast("⚠ 无法加载导出库，请检查网络连接");
  document.head.appendChild(s);
}

function doExportExcel(){
  const XLSX=window.XLSX;
  const STATUS_MAP={"未读":"未读","阅读中":"阅读中","已读":"已读","搁置":"搁置"};

  const sort=document.getElementById("sort-select").value;
  const dd=sortDir==="asc"?1:-1;
  const sorted=[...books].sort((a,b)=>{
    if(sort==="title")return dd*a.title.localeCompare(b.title);
    if(sort==="rating")return dd*(a.rating-b.rating);
    if(sort==="douban")return dd*(parseFloat(a.doubanScore||0)-parseFloat(b.doubanScore||0));
    if(sort==="year")return dd*(parseInt(a.year||0)-parseInt(b.year||0));
    if(sort==="addedDate")return dd*(a.addedDate||"").localeCompare(b.addedDate||"");
    return dd*(a.id-b.id);
  });

  const headers=["序号","书名","作者","分类","自定义分类","阅读状态","出版年份","页数","添加日期","我的评分(1-5)","豆瓣评分(0-10)","内容简介"];
  const rows=sorted.map((b,i)=>[
    i+1,
    b.title||"",
    b.author||"",
    b.category||"",
    b.customTag||"",
    b.status||"",
    b.year||"",
    b.pages||"",
    b.addedDate||"",
    b.rating||"",
    b.doubanScore||"",
    b.notes||"",
  ]);

  const wsData=[headers,...rows];
  const ws=XLSX.utils.aoa_to_sheet(wsData);

  // Column widths
  ws["!cols"]=[
    {wch:6},{wch:28},{wch:14},{wch:8},{wch:12},{wch:8},
    {wch:10},{wch:8},{wch:12},{wch:14},{wch:14},{wch:48}
  ];

  // Style header row (bold, background) — requires xlsx-style or manual XML trick
  // We use cell metadata supported by SheetJS community edition
  const range=XLSX.utils.decode_range(ws["!ref"]);
  for(let C=range.s.c;C<=range.e.c;C++){
    const addr=XLSX.utils.encode_cell({r:0,c:C});
    if(!ws[addr])continue;
    ws[addr].s={
      font:{bold:true,color:{rgb:"FFFFFF"},sz:11},
      fill:{fgColor:{rgb:"4F46E5"}},
      alignment:{horizontal:"center",vertical:"center",wrapText:false},
      border:{bottom:{style:"medium",color:{rgb:"4338CA"}}}
    };
  }
  // Wrap notes column, align data rows
  for(let R=1;R<=range.e.r;R++){
    for(let C=range.s.c;C<=range.e.c;C++){
      const addr=XLSX.utils.encode_cell({r:R,c:C});
      if(!ws[addr])ws[addr]={t:"s",v:""};
      ws[addr].s={
        alignment:{
          vertical:"center",
          wrapText:C===11,  // notes column (index 11)
          horizontal:C===0||C===5||C===7||C===8||C===9||C===10?"center":"left"
        },
        font:{sz:11},
        // alternating row fill
        fill:R%2===0?{fgColor:{rgb:"F8F6FF"}}:{fgColor:{rgb:"FFFFFF"}}
      };
    }
  }

  // Freeze top row
  ws["!freeze"]={xSplit:0,ySplit:1,topLeftCell:"A2",activePane:"bottomLeft"};

  const wb=XLSX.utils.book_new();
  const sheetName=(libName||"书库").slice(0,31); // Excel sheet name max 31 chars
  XLSX.utils.book_append_sheet(wb,ws,sheetName);

  // Add a stats sheet
  const statsData=[
    ["统计项","数量"],
    ["总藏书",books.length],
    ["已读",books.filter(b=>b.status==="已读").length],
    ["阅读中",books.filter(b=>b.status==="阅读中").length],
    ["未读",books.filter(b=>b.status==="未读").length],
    ["搁置",books.filter(b=>b.status==="搁置").length],
    ["",""],
    ["导出时间",new Date().toLocaleString("zh-CN")],
    ["书库名称",libName||"私人书库"],
  ];
  const ws2=XLSX.utils.aoa_to_sheet(statsData);
  ws2["!cols"]=[{wch:14},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws2,"统计概览");

  const ts=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`${libName||"私人书库"}_汇总_${ts}.xlsx`,{bookType:"xlsx",type:"binary",cellStyles:true});
  showToast(`✓ 已导出 ${books.length} 册书籍数据`);
}

let toastTimer;
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg||"✓ 已保存";t.className="show";
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className="",2500);
}

render();
initFileSync();
</script>
